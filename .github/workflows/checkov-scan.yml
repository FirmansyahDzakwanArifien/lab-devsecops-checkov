# ~/lab-checkov/.github/workflows/checkov-scan.yml
name: "IaC Security Scan dengan Checkov"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - "kubernetes/**"
      - "dockerfile/**"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  checkov-scan:
    name: "Checkov Security Scan"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: "Run Checkov - Terraform"
        id: checkov-terraform
        uses: bridgecrewio/checkov-action@d4770c1ac4a966d8c3305b79c348c26232123aa1 # master (v12.3146.0)
        with:
          directory: terraform/
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov-terraform.sarif
          soft_fail: false
        continue-on-error: true

      - name: "Run Checkov - Kubernetes"
        id: checkov-k8s
        uses: bridgecrewio/checkov-action@d4770c1ac4a966d8c3305b79c348c26232123aa1 # master (v12.3146.0)
        with:
          directory: kubernetes/
          framework: kubernetes
          output_format: cli,sarif
          output_file_path: console,checkov-k8s.sarif
          soft_fail: true
        continue-on-error: true

      - name: "Run Checkov - Dockerfile"
        id: checkov-dockerfile
        uses: bridgecrewio/checkov-action@d4770c1ac4a966d8c3305b79c348c26232123aa1 # master (v12.3146.0)
        with:
          directory: dockerfile/
          framework: dockerfile
          output_format: cli,sarif
          output_file_path: console,checkov-dockerfile.sarif
          soft_fail: true
        continue-on-error: true

      - name: "Upload SARIF ke GitHub Security tab"
        uses: github/codeql-action/upload-sarif@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3
        if: always() && hashFiles('checkov-terraform.sarif') != ''
        with:
          sarif_file: checkov-terraform.sarif
          category: "checkov-terraform"

      - name: "Block pipeline jika ditemukan pelanggaran di Terraform"
        if: steps.checkov-terraform.outcome == 'failure'
        run: |
          echo "Checkov menemukan pelanggaran keamanan pada Terraform!"
          echo "Periksa log job atau tab Security -> Code scanning untuk detail."
          exit 1

      - name: "Report sukses"
        if: steps.checkov-terraform.outcome == 'success'
        run: |
          echo "Seluruh pemeriksaan Checkov pada Terraform PASSED!"
